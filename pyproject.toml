[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-evidence-recorder"
version = "0.1.0"
description = "Local-first operational evidence capsules for developer workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thiago" }]
dependencies = []

[project.scripts]
flightrecorder = "flightrecorder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
